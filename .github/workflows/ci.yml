name: GeoGrowth AI - pruebas
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validacion:
    name: Datos y componentes web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Auditoría de datos
        run: python scripts/test_project.py
      - name: Verificar sintaxis JavaScript
        run: find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Smoke test del mapa V11
        run: node scripts/test_map.cjs
      - name: Regresión del mapa V5 y flujo V9 ampliado
        run: node scripts/test_v9_extension.cjs
      - name: Verificar sintaxis de módulos opcionales V9
        run: |
          node --check geogrowth-v9-extensiones.js
          node --check geogrowth-opportunity-brief-v2.js
          node --check geogrowth-campaign-guide-v1.js
      - name: Validar Opportunity Brief por territorio e IIT
        run: node scripts/test_opportunity_brief.cjs
      - name: Prueba real de navegador de V9 ampliado
        run: python scripts/test_browser_v9.py
