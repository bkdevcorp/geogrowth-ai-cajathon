name: GeoGrowth AI - pruebas V12
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validacion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Datos y estructura
        run: |
          python scripts/test_project.py
          python scripts/test_aggregate_convencion.py
      - name: Sintaxis y pruebas de módulos
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/test_map.cjs
          node scripts/test_expansion_places.cjs
          node scripts/test_v12.cjs
      - name: Regresión en navegador V12
        run: python scripts/test_browser_v12.py
